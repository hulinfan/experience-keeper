name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          if [ $status -ne 0 ]; then
            python .github/scripts/annotate_failures.py pytest.log
          fi
          exit $status
